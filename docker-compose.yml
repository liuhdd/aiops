services:
  backend:
    build:
      context: ./backend
    env_file: .env
    environment:
      - DB_PATH=/data/aiops.db
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
